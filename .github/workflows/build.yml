name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AramaKaydedici-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Releases sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AramaKaydedici.apk
          gh release delete son-surum --cleanup-tag --yes || true
          gh release create son-surum AramaKaydedici.apk \
            --title "Arama Kaydedici (son sürüm)" \
            --notes "Telefondan bu sayfayı açıp AramaKaydedici.apk dosyasına dokunarak indirip kurun." \
            --target "${{ github.sha }}"
